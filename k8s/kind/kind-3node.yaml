# Cluster kind 3 node (1 control plane + 2 worker) untuk Modul 6.
# Pakai: kind create cluster --name lab --config k8s/kind/kind-3node.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Port 8090 di laptop -> NodePort 30080 di cluster (lihat k8s/extras/service-nodeport.yaml).
      # Berbeda dari port-forward, jalur ini membagi traffic ke SEMUA pod, jadi cocok untuk uji beban.
      - containerPort: 30080
        hostPort: 8090
        protocol: TCP
  - role: worker
  - role: worker
